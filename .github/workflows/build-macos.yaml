name: Build macOS

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    name: macos-${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    strategy:
      fail-fast: false

      matrix:
        arch:
          - name: arm64
            isa_name: arm64
            runner: macos-14
          # Note: x86_64 (Intel) runner retired by GitHub on 2024-12. macos-13
          # is no longer provided. The fork targets arm64 (Apple Silicon)
          # consumers; x64 builds remain on the upstream project's
          # nightly-release workflow which still uses the maintained runner.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "ymir-artifact-name=ymir-macos-${{ matrix.arch.name }}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        shell: bash
        run: brew install cmake ninja

      - name: Bootstrap vcpkg
        shell: bash
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          # Hash on the manifest + triple-specific files so an ABI change in
          # the macOS arm64 baseline invalidates the cache deterministically.
          key: macos-${{ matrix.arch.name }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            macos-${{ matrix.arch.name }}-vcpkg-

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.arch.name }}-osx \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch.isa_name }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DYmir_ENABLE_DEVLOG=OFF \
            -DYmir_ENABLE_IMGUI_DEMO=OFF \
            -DYmir_ENABLE_UPDATE_CHECKS=OFF \
            -DYmir_ENABLE_SANDBOX=OFF \
            -DYmir_ENABLE_YMDASM=OFF \
            -DYmir_ENABLE_TESTS=OFF \
            -DYmir_ENABLE_IPO=ON \
            -DYmir_EXTRA_INLINING=ON \
            -DYmir_LIBRARY_ONLY=OFF \
            -S ${{ github.workspace }} \
            -G Ninja

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel

      - name: Get gamecontrollerdb.txt
        uses: actions/checkout@v4
        with:
          repository: mdqinc/SDL_GameControllerDB
          sparse-checkout: |
            gamecontrollerdb.txt
            LICENSE
          sparse-checkout-cone-mode: false
          path: gcdb

      - name: Package artifacts
        run: |
          mkdir -p licenses
          find "${{ steps.strings.outputs.build-output-dir }}/vcpkg_installed" -type f -path "*/share/*/copyright" | while read -r file; do
            port=$(basename "$(dirname "$file")")
            cp "$file" "licenses/${port}-LICENSE.txt"
          done
          cp -Rf apps/ymir-sdl3/res/licenses/* ./licenses/ 2>/dev/null || true
          cp -f vendor/concurrentqueue/concurrentqueue/LICENSE.md licenses/concurrentqueue-LICENSE.md
          cp -f vendor/imgui/imgui/LICENSE.txt                    licenses/imgui-LICENSE.txt
          cp -f vendor/libchdr/libchdr/LICENSE.txt                licenses/libchdr-LICENSE.txt
          cp -f vendor/lz4/lz4/lib/LICENSE                        licenses/lz4-LICENSE
          cp -f vendor/mio/LICENSE                                licenses/mio-LICENSE
          cp -f vendor/xxHash/xxHash/LICENSE                      licenses/xxHash-LICENSE
          cp -f LICENSE                                           licenses/Ymir-LICENSE
          cp -f ${{ github.workspace }}/gcdb/LICENSE              licenses/SDL_GameControllerDB-LICENSE
          cp -f ${{ github.workspace }}/gcdb/gamecontrollerdb.txt gamecontrollerdb.txt

          ARTIFACT_NAME=${{ steps.strings.outputs.ymir-artifact-name }}
          zip -r "${ARTIFACT_NAME}.zip" licenses README.md gamecontrollerdb.txt

          cd ${{ steps.strings.outputs.build-output-dir }}/apps/ymir-sdl3/
          APP_NAME=$(ls -d ymir-sdl3.app)
          # Rename versioned binary to fixed name
          mv "${APP_NAME}/Contents/MacOS/ymir-sdl3-"* "${APP_NAME}/Contents/MacOS/ymir-sdl3" 2>/dev/null || true
          # Ad-hoc codesign
          codesign --force --deep --sign - "${APP_NAME}"
          zip -r "${{ github.workspace }}/${ARTIFACT_NAME}.zip" "${APP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.strings.outputs.ymir-artifact-name }}
          path: ${{ steps.strings.outputs.ymir-artifact-name }}.zip
